events {}

http {
    # Sets Connection: upgrade only when the client asked for a WebSocket upgrade.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Round-robin (Nginx default). No ip_hash / sticky config:
    # clients use WebSocket-only transport, so there is no HTTP long-polling
    # session that needs to land on the same instance.
    upstream backend {
        server backend1:3000;
        server backend2:3000;
        server backend3:3000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Default is 60s, which would kill idle sockets between pings.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}